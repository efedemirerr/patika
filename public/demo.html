<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MoveCircle · Sunum</title>
<style>
  :root { --bg:#0e1016; --ink:#e9ebf2; --mute:#8b90a0; --accent:#9be7ff; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:radial-gradient(ellipse at 70% 40%, #1d2130 0%, var(--bg) 65%); color:var(--ink);
    font-family:"Inter Tight",Inter,system-ui,sans-serif; overflow:hidden; }
  .stage { height:100%; display:flex; align-items:center; justify-content:center; gap:6vw; padding:3vh 4vw; }
  .side { max-width:380px; }
  .side h1 { font-family:Fraunces,Georgia,serif; font-size:56px; line-height:1; letter-spacing:-.02em; }
  .side p { color:var(--mute); margin-top:14px; font-size:18px; line-height:1.45; }
  .side .row { display:flex; gap:8px; margin-top:28px; flex-wrap:wrap; }
  .side button { background:#232736; color:var(--ink); border:1px solid #33384a; border-radius:999px; padding:10px 16px; font:inherit; font-size:15px; cursor:pointer; }
  .side button.on { background:var(--accent); color:#0e1016; border-color:var(--accent); }
  .phone-wrap { height:94vh; aspect-ratio:430/912; position:relative; }
  .phone { position:absolute; inset:0; border-radius:15% / 7%; background:#05060a; padding:3.2%;
    box-shadow:0 0 0 2px #3a3f52, 0 0 0 7px #151821, 0 40px 120px rgba(0,0,0,.6), 0 0 80px rgba(155,231,255,.12); }
  .screen { width:100%; height:100%; border-radius:12.5% / 5.8%; overflow:hidden; position:relative; background:#111; }
  .screen iframe { border:0; width:390px; height:844px; transform-origin:0 0; position:absolute; top:0; left:0; }
  .island { position:absolute; top:2.6%; left:50%; transform:translateX(-50%); width:30%; height:3.4%; background:#000; border-radius:999px; z-index:2; pointer-events:none; }
  @media (max-width:900px) { .side { display:none; } }
</style>
</head>
<body>
<div class="stage">
  <div class="side">
    <h1>MoveCircle</h1>
    <p id="sub">Canlı uygulama — fareyle tıklayarak gezebilirsiniz. Tüm veriler kurgusal, harita çevrimdışı.</p>
    <div class="row">
      <button data-go="home">Ana Sayfa</button><button data-go="maps">Haritalar</button><button data-go="record">Kayıt</button>
      <button data-go="groups">Gruplar</button><button data-go="you">Sen</button>
    </div>
    <div class="row">
      <button data-lang="tr">Türkçe</button><button data-lang="en">English</button>
      <button id="fs">Tam ekran</button>
    </div>
  </div>
  <div class="phone-wrap"><div class="phone"><div class="screen"><iframe id="app" title="MoveCircle"></iframe></div></div></div>
</div>
<script>
  const app = document.getElementById('app'), screen = app.parentElement;
  const fit = () => { const s = screen.clientWidth / 390; app.style.transform = `scale(${s})`; app.style.height = (screen.clientHeight / s) + 'px'; };
  addEventListener('resize', fit); fit();
  let lang = 'tr'; try { lang = localStorage.getItem('movecircle-lang') || 'tr'; localStorage.setItem('movecircle-lang', lang); } catch (e) {}
  app.src = './?v=' + Date.now() + '#/home';
  // Uygulama 6 sn içinde çizilmezse bir kez yeniden yükle.
  setTimeout(() => { try { const d = app.contentDocument; if (!d || !d.querySelector('#view *')) app.contentWindow.location.reload(); } catch (e) {} }, 6000);
  const mark = () => document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  mark();
  document.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.go) app.contentWindow.location.hash = '#/' + b.dataset.go;
    if (b.dataset.lang) { lang = b.dataset.lang; try { localStorage.setItem('movecircle-lang', lang); } catch (e) {} mark(); app.src = './?v=' + Date.now() + '#/home'; }
    if (b.id === 'fs') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  });
</script>
</body>
</html>
