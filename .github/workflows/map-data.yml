name: Harita verisi (rotalar, kıyı, parklar, yükseklik)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Veriyi indir
        run: node scripts/fetch-map-data.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/map/data.json
          git diff --cached --quiet || git commit -m "Harita verisini güncelle (OSM + OSRM + DEM)"
          git push
