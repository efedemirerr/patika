name: Build (Web + APK)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      # Gerçek, çevrimdışı harita: Protomaps (OpenStreetMap) dünya dosyasından yalnızca Kadıköy çevresi kesilir.
      # Dosya web sürümünde ve APK'nın içinde statik olarak durur; uygulama çalışırken hiçbir harita sunucusuna bağlanmaz.
      - name: Harita önbelleği
        id: mapcache
        uses: actions/cache@v4
        with:
          path: public/maps/kadikoy.pmtiles
          key: pmtiles-kadikoy-z15-v1

      - name: Çevrimdışı harita dosyasını kes (PMTiles)
        if: steps.mapcache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public/maps /tmp/pmt
          url=$(gh api repos/protomaps/go-pmtiles/releases/latest --jq '.assets[] | select(.name | test("Linux_x86_64.tar.gz$")) | .browser_download_url')
          curl -sL "$url" | tar xz -C /tmp/pmt
          for i in $(seq 0 20); do
            d=$(date -u -d "-$i day" +%Y%m%d)
            if curl -sfI "https://build.protomaps.com/$d.pmtiles" >/dev/null; then src="https://build.protomaps.com/$d.pmtiles"; break; fi
          done
          echo "kaynak: $src"
          /tmp/pmt/pmtiles extract "$src" public/maps/kadikoy.pmtiles --bbox=29.0,40.936,29.143,41.044 --maxzoom=15
          ls -lh public/maps

      - name: Web build
        run: npm run build

      - name: Web paketini zip'le
        run: cd dist && zip -r ../patika-web.zip .

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Capacitor sync
        run: npx cap sync android

      - name: APK derle (debug)
        working-directory: android
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../patika-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: patika-apk
          path: patika-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: patika-web
          path: patika-web.zip

      - name: GitHub Pages için yükle
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Release oluştur (v* etiketi)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" patika-debug.apk patika-web.zip --title "Patika ${GITHUB_REF_NAME}" --generate-notes

  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
